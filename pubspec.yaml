name: maktabat_almoslim
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.5.0+17

environment:
  sdk: ^3.5.3
dependencies:
  adaptive_theme: ^3.6.0
  android_intent_plus: ^5.3.0
  audioplayers: ^6.5.0
  carousel_slider: ^5.0.0
  equatable: ^2.0.7
  firebase_core: ^3.6.0
  firebase_remote_config: ^5.4.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.4
  flutter_svg: ^2.0.17
  hijri: ^3.0.0
  http: ^1.6.0
  package_info_plus: ^8.1.1
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  marquee: ^2.3.0
  table_calendar: ^3.1.3
  hijri_date_time: ^1.1.0
  adhan: ^2.0.0+1
  awesome_notifications: ^0.9.3+1
  flutter_qiblah: ^3.1.0+1
  geolocator: ^13.0.4
  google_mobile_ads: ^5.3.1

dependency_overrides:
  flutter_compass_v2: null

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/logo.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/
    - assets/icons/
    - assets/json/
    - assets/islamic_icons/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs-Bold.ttf
        - asset: assets/fonts/UthmanicHafs-Regular.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
